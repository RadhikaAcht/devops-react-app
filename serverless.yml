STEP 1: Create Project
─────────────────────────────────────
1. Go to AWS CodeBuild console
2. Click: "Create build project"
3. Project name: devops-react-build
4. Source provider: GitHub
5. Repository: devops-react-app
6. Environment:
   - Operating system: Ubuntu
   - Runtime: Node.js
   - Runtime version: 18
7. Service role: Create new role
8. Click: "Create build project"
✅ DONE!

STEP 2: Add Buildspec
─────────────────────────────────────
(Your buildspec.yml should already be in your repo)

If not, create buildspec.yml in project root:

version: 0.2

phases:
  pre_build:
    commands:
      - echo "Installing dependencies..."
      - npm install
      
  build:
    commands:
      - echo "Building React application..."
      - npm run build
      
  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - build/**/*
  name: ReactBuildArtifact

cache:
  paths:
    - node_modules/**/*

